services:

  echo-server:
    # Echoes every TCP connection back to its sender.
    image: alpine/socat:1.8.0.3
    command: TCP-LISTEN:8800,fork,reuseaddr,backlog=4096 EXEC:cat
    restart: always
    ports:
      - "2701:8800"
    healthcheck:
      test: nc -z 127.0.0.1 8800
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

  healthy_checker:
    container_name: tcp_healthiness_checker
    image: busybox
    depends_on:
      echo-server:
        condition: service_healthy