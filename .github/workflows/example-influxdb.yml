name: Example - InfluxDB

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'influxdb/**'
      - '.github/workflows/example-influxdb.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'influxdb/**'
      - '.github/workflows/example-influxdb.yml'

jobs:
  example:
    uses: ./.github/workflows/run-example.yml
    with:
      project: influxdb
