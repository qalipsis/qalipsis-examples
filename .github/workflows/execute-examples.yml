# Runs all the examples, each in a job of its own. Each example also has its own workflow, which only runs when its
# directory changes; this one runs when the files shared by all the examples change, or on demand.
name: Verification of examples

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'project.version'
      - 'gradlew'
      - 'gradle/**'
      - 'build-config/**'
      - '.github/workflows/execute-examples.yml'
      - '.github/workflows/run-example.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'project.version'
      - 'gradlew'
      - 'gradle/**'
      - 'build-config/**'
      - '.github/workflows/execute-examples.yml'
      - '.github/workflows/run-example.yml'
#  schedule:
#    - cron: '0 5 * * 7' # At 5:00 UTC on Sunday.

jobs:
  cassandra:
    uses: ./.github/workflows/example-cassandra.yml

  distributed-system:
    uses: ./.github/workflows/example-distributed-system.yml

  elasticsearch:
    uses: ./.github/workflows/example-elasticsearch.yml

  graphite:
    uses: ./.github/workflows/example-graphite.yml

  hello-world:
    uses: ./.github/workflows/example-hello-world.yml

  influxdb:
    uses: ./.github/workflows/example-influxdb.yml

  jms:
    uses: ./.github/workflows/example-jms.yml

  kafka:
    uses: ./.github/workflows/example-kafka.yml

  mongodb:
    uses: ./.github/workflows/example-mongodb.yml

  netty-mqtt:
    uses: ./.github/workflows/example-netty-mqtt.yml

  netty-tcp:
    uses: ./.github/workflows/example-netty-tcp.yml

  quickstart-http:
    uses: ./.github/workflows/example-quickstart-http.yml

  r2dbc-jasync:
    uses: ./.github/workflows/example-r2dbc-jasync.yml

  rabbitmq:
    uses: ./.github/workflows/example-rabbitmq.yml

  redis:
    uses: ./.github/workflows/example-redis.yml

  sql:
    uses: ./.github/workflows/example-sql.yml

