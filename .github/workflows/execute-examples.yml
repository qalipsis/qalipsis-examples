name: Verification of examples

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
#  schedule:
#    - cron: '0 5 * * 7' # At 5:00 UTC on Sunday.

env:
  GITHUB_ACTIONS: true

jobs:
  build:
    # The native image of demo-microservice takes a large part of it. Each step has its own timeout, so that a
    # hanging example fails alone instead of using the time of the job.
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        # The JDK that starts Gradle. Gradle and the examples always run on JDK 21 (daemon JVM criteria and
        # Kotlin toolchain), which Gradle downloads.
        java: [ '25' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4 # https://github.com/actions/setup-java
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1.0.4

      # demo-microservice is a build of its own; its native image is used by the distributed example.
      - name: Create demo service
        if: always()
        timeout-minutes: 20
        uses: gradle/gradle-build-action@v3.3.2
        with:
          build-root-directory: demo-microservice
          arguments: build docker

      - name: Hello World
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :hello-world:check

      - name: Apache Cassandra
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :cassandra:check

      - name: Elasticsearch
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :elasticsearch:check

      - name: Graphite
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :graphite:check

      - name: InfluxDB
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :influxdb:check

      # Failing on Github: ERROR: for healthy_checker  Container "abaf099899fa" is unhealthy
      #- name: Jakarta EE Messaging
      #  if: always()
      #  uses: gradle/gradle-build-action@v3.3.2
      #  with:
      #    arguments: :jakarta-ee-messaging:check

      - name: Java Messaging Service
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :jms:check

      - name: Apache Kafka
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :kafka:check

      - name: MongoDB
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :mongodb:check

      - name: Netty - MQTT
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :netty-mqtt:check

      - name: Netty - TCP
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :netty-tcp:check

      - name: R2DBC Jasync
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :r2dbc-jasync:check

      - name: RabbitMQ
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :rabbitmq:check

      - name: Redis
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :redis:check

      - name: SQL
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :sql:check

      - name: Quickstart HTTP
        if: always()
        timeout-minutes: 10
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :quickstart-http:check

      - name: Distributed system
        if: always()
        timeout-minutes: 20
        uses: gradle/gradle-build-action@v3.3.2
        with:
          arguments: :distributed-system:check

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          fail_on_failure: true
          include_passed: true
          annotations_limit: 0
          summary: true
          detailed_summary: true