name: Example - Graphite

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'graphite/**'
      - '.github/workflows/example-graphite.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'graphite/**'
      - '.github/workflows/example-graphite.yml'

jobs:
  example:
    uses: ./.github/workflows/run-example.yml
    with:
      project: graphite
