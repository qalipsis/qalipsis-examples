# Builds the native image of demo-microservice for linux/amd64 and linux/arm64, each on a runner of its own
# architecture (no emulation: the GraalVM builder image needs an x86-64-v3 CPU, which QEMU does not provide),
# then merges both into one multi-architecture tag on Docker Hub.
#
# Needs the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, with write access to aerisconsulting.
name: demo-microservice image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag of the image, the version of demo-microservice/build.gradle.kts
        required: true
        default: 0.2.0

env:
  IMAGE: docker.io/aerisconsulting/qalipsis-demo-microservice

jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: demo-microservice
          file: demo-microservice/src/main/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=demo-microservice-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=demo-microservice-${{ matrix.arch }}
      - name: Save the digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create the multi-architecture tags
        run: |
          docker buildx imagetools create -t "${IMAGE}:${{ inputs.version }}" -t "${IMAGE}:latest" \
            "${IMAGE}@$(cat digests/amd64)" "${IMAGE}@$(cat digests/arm64)"
          docker buildx imagetools inspect "${IMAGE}:${{ inputs.version }}"
