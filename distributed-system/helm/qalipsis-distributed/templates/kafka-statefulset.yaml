{{- if .Values.kafka.enabled }}
{{- $kafkaHost := printf "%s-kafka" (include "qalipsis.fullname" .) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $kafkaHost }}
  labels:
    {{- include "qalipsis.labels" . | nindent 4 }}
    {{- include "qalipsis.selectorLabels" (dict "Release" .Release "component" "kafka") | nindent 4 }}
spec:
  serviceName: {{ $kafkaHost }}
  # Single KRaft node acting as broker and controller.
  replicas: 1
  selector:
    matchLabels:
      {{- include "qalipsis.selectorLabels" (dict "Release" .Release "component" "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qalipsis.labels" . | nindent 8 }}
        {{- include "qalipsis.selectorLabels" (dict "Release" .Release "component" "kafka") | nindent 8 }}
    spec:
      # Service links inject KAFKA_*-like variables that the image would read as broker settings.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          ports:
            - containerPort: 9092
              name: internal
            - containerPort: 9093
              name: controller
            - containerPort: 19092
              name: external
          env:
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            # INTERNAL for the pods of the release, EXTERNAL for QALIPSIS through a port-forward on localhost:19092.
            - name: KAFKA_LISTENERS
              value: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://{{ $kafkaHost }}:{{ .Values.kafka.service.port }},EXTERNAL://localhost:{{ .Values.kafka.service.externalPort }}"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            # The services create their topics when they first write to them.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Subdirectory, so that the lost+found of a fresh volume is not taken as a partition.
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data/logs"
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      {{- if not .Values.kafka.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: { }
      {{- end }}
  {{- if .Values.kafka.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size }}
        {{- if .Values.kafka.persistence.storageClass }}
        storageClassName: {{ .Values.kafka.persistence.storageClass }}
        {{- end }}
  {{- end }}
{{- end }}
