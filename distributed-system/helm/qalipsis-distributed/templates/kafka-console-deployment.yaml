{{- if .Values.kafkaConsole.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qalipsis.fullname" . }}-kafka-console
  labels:
    {{- include "qalipsis.labels" . | nindent 4 }}
    {{- include "qalipsis.selectorLabels" (dict "Release" .Release "component" "kafka-console") | nindent 4 }}
spec:
  replicas: {{ .Values.kafkaConsole.replicas }}
  selector:
    matchLabels:
      {{- include "qalipsis.selectorLabels" (dict "Release" .Release "component" "kafka-console") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qalipsis.labels" . | nindent 8 }}
        {{- include "qalipsis.selectorLabels" (dict "Release" .Release "component" "kafka-console") | nindent 8 }}
    spec:
      # Service links inject KAFKA_*-like variables that the console would read as its configuration.
      enableServiceLinks: false
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z {{ include "qalipsis.fullname" . }}-kafka {{ .Values.kafka.service.port }}; do echo waiting for kafka; sleep 2; done' ]
      containers:
        # Redpanda Console works with any Apache Kafka broker.
        - name: kafka-console
          image: "{{ .Values.kafkaConsole.image.repository }}:{{ .Values.kafkaConsole.image.tag }}"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KAFKA_BROKERS
              value: "{{ include "qalipsis.fullname" . }}-kafka:{{ .Values.kafka.service.port }}"
          resources:
            {{- toYaml .Values.kafkaConsole.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
{{- end }}
