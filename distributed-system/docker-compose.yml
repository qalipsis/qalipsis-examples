services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.21
    restart: always
    environment:
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - discovery.type=single-node
      - bootstrap.memory_lock=true
    volumes:
      - elasticsearch-volume:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: nc -z localhost 9200
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.21
    restart: on-failure:6
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    healthcheck:
      test: curl http://localhost:5601
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

  redis:
    image: redis
    ports:
      - '6379:6379'
    healthcheck:
      test: redis-cli --scan --pattern '*' --count 1
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka-native:4.1.2
    container_name: kafka
    ports:
      - "19092:19092"
    environment:
      CLUSTER_ID: cWFsaXBzaXMtZXhhbXBsZXM
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL for the containers of this file, EXTERNAL for QALIPSIS on the host (localhost:19092).
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # The services create their topics when they first write to them.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s

  # A web interface for Kafka. Redpanda Console works with any Apache Kafka broker.
  kafka-console:
    image: docker.redpanda.com/redpandadata/console:v3.15.0
    restart: on-failure:6
    environment:
      KAFKA_BROKERS: kafka:9092
    ports:
      - 28080:8080
    depends_on:
      kafka:
        condition: service_healthy

  timescale:
    image: timescale/timescaledb:latest-pg16
    restart: always
    platform: linux/amd64
    environment:
      POSTGRES_USER: qalipsis_demo
      POSTGRES_PASSWORD: qalipsis
      POSTGRES_DB: qalipsis
    volumes:
      - ./docker-config/timescale/init/999_create_schemas.sh:/docker-entrypoint-initdb.d/999_create_schemas.sh
      - timescale-volume:/var/lib/postgresql/data
    ports:
      - "25432:5432"

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DEFAULT_EMAIL: qalipsis@qalipsis.com
      PGADMIN_DEFAULT_PASSWORD: "qalipsis"
    volumes:
      - ./docker-config/pgadmin/servers.json:/pgadmin4/servers.json
      - ./volumes/pgadmin/backup:/backup
    ports:
      - "25433:80"
    depends_on:
      - timescale

  http-to-kafka:
    image: aerisconsulting/http-to-kafka
    platform: linux/amd64
    command:
      - "--https=true"
      - "--ssl-key=http-server.key"
      - "--ssl-cert=http-server.crt"
      - "--kafka-bootstrap=kafka:9092"
      - "--kafka-topic=http-request"
    ports:
      - "18080:8080"
      - "18443:8443"
    depends_on:
      kafka:
        condition: service_healthy

  kafka-to-db:
    # Native image, for linux/amd64 and linux/arm64: built by ./gradlew docker in ../demo-microservice.
    image: aerisconsulting/qalipsis-demo-microservice:0.2.0
    restart: on-failure:6
    environment:
      - KAFKA_ENABLED=true
      - MESSAGING_KAFKA_LISTENER_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URI=redis://redis:6379
      - DATASOURCES_DEFAULT_URL=jdbc:postgresql://timescale:5432/qalipsis
      - DATASOURCES_DEFAULT_USERNAME=qalipsis_demo
      - DATASOURCES_DEFAULT_PASSWORD=qalipsis
    depends_on:
      - redis
      - kafka
      - timescale

  influxdb:
    container_name: influxdb-server
    image: influxdb
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: qalipsis
      DOCKER_INFLUXDB_INIT_PASSWORD: qalipsis
      DOCKER_INFLUXDB_INIT_ORG: qalipsis
      DOCKER_INFLUXDB_INIT_BUCKET: iot
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: qalipsis
    ports:
      - "18086:8086"
    healthcheck:
      test: curl http://localhost:8086 | grep "InfluxDB is a time series platform"
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

  healthy_checker:
    container_name: distributed_healthiness_checker
    image: busybox
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  elasticsearch-volume:
  timescale-volume: